name: Deploy GitHub Pages

# Publica o front no Pages. Com as variáveis do repositório SUPABASE_URL e
# SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables),
# usa o backend no Supabase e a colaboração é real; sem elas, cai no modo
# local (dados só no navegador). O Pages exige repositório público (ou plano pago).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # no push só publica quando o Supabase está configurado; manual publica sempre
    if: github.event_name == 'workflow_dispatch' || vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BACKEND: ${{ vars.SUPABASE_URL != '' && 'supabase' || 'local' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
